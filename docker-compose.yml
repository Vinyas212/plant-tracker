services:
  backend:
    build: ./backend
    container_name: plant-tracker-backend
    ports:
      - "5000:5000"
    volumes:
      - ./database:/app/database
    environment:
      PORT: 5000
      DB_PATH: /app/database/plant-tracker.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: plant-tracker-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
